<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7d3a8"/><stop offset="1" stop-color="#c6a15b"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4278"/><stop offset="1" stop-color="#12305a"/></linearGradient>
    <clipPath id="face"><circle cx="210" cy="150" r="46"/></clipPath>
  </defs>
  <circle cx="260" cy="210" r="190" fill="#12305a" opacity=".55"/>
  <circle cx="260" cy="210" r="150" fill="none" stroke="#c6a15b" stroke-opacity=".25" stroke-dasharray="3 7"/>
  <!-- notebook -->
  <rect x="90" y="70" width="300" height="200" rx="14" fill="#071528"/>
  <rect x="102" y="82" width="276" height="176" rx="6" fill="url(#scr)"/>
  <path d="M60 270h360l-22 26H82z" fill="#0b1f3a" stroke="#c6a15b" stroke-opacity=".4"/>
  <rect x="210" y="274" width="60" height="6" rx="3" fill="#c6a15b" opacity=".5"/>
  <!-- chamada de vídeo: foto da advogada -->
  <circle cx="210" cy="150" r="50" fill="none" stroke="url(#gd)" stroke-width="2"/>
  <image href="data:image/jpeg;base64," x="164" y="104" width="92" height="92" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="160" y="212" width="100" height="10" rx="5" fill="#d6b77a" opacity=".85"/>
  <rect x="176" y="230" width="68" height="7" rx="3.5" fill="#ffffff" opacity=".3"/>
  <!-- miniatura do cliente -->
  <rect x="290" y="96" width="74" height="56" rx="8" fill="#0b1f3a" stroke="#c6a15b" stroke-opacity=".5"/>
  <circle cx="327" cy="118" r="10" fill="#d6b77a" opacity=".8"/>
  <path d="M309 146a18 14 0 0136 0" fill="#d6b77a" opacity=".8"/>
  <!-- controles -->
  <circle cx="300" cy="234" r="11" fill="#c0392b"/><path d="M295 234h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="330" cy="234" r="11" fill="#ffffff" opacity=".15"/><circle cx="360" cy="234" r="11" fill="#ffffff" opacity=".15"/>
  <!-- balão de mensagem -->
  <g transform="translate(316 18)">
    <rect width="196" height="62" rx="14" fill="#ffffff"/>
    <path d="M24 62l-6 14 18-14z" fill="#ffffff"/>
    <circle cx="26" cy="31" r="13" fill="#25d366"/>
    <path d="M20 31l4 4 8-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="27" font-size="12" font-weight="700" fill="#0b1f3a" font-family="Segoe UI, Arial, sans-serif">Documentos recebidos</text>
    <text x="48" y="44" font-size="11" fill="#5e6678" font-family="Segoe UI, Arial, sans-serif">Analisando seu caso…</text>
  </g>
  <!-- documento assinado -->
  <g transform="translate(18 170) rotate(-8)">
    <rect width="92" height="118" rx="8" fill="#fbf8f2"/>
    <rect x="14" y="16" width="52" height="7" rx="3.5" fill="#0b1f3a"/>
    <rect x="14" y="32" width="64" height="5" rx="2.5" fill="#cfc6b4"/>
    <rect x="14" y="44" width="58" height="5" rx="2.5" fill="#cfc6b4"/>
    <rect x="14" y="56" width="64" height="5" rx="2.5" fill="#cfc6b4"/>
    <path d="M16 92c8-10 14 6 22-4s10 2 18-2" stroke="#12305a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="94" r="12" fill="url(#gd)"/>
    <path d="M65 94l3 3 6-6" stroke="#0b1f3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- escudo / segurança -->
  <g transform="translate(410 300)">
    <circle r="34" fill="url(#gd)"/>
    <path d="M0-18l14 5v10c0 9-6 16-14 19-8-3-14-10-14-19v-10z" fill="#0b1f3a"/>
    <path d="M-6 0l4 4 8-9" stroke="#d6b77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#d6b77a"><circle cx="70" cy="80" r="3"/><circle cx="470" cy="160" r="2.5"/><circle cx="120" cy="360" r="2"/><circle cx="300" cy="380" r="3"/></g>
</svg>
